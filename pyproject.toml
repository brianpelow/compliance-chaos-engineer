[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliance-chaos-engineer"
version = "0.1.0"
description = "Chaos engineering for governance controls: inject failures, score detection"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Brian Pelow" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
chaos = "chaos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chaos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]